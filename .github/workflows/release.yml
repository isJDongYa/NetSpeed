name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-and-check:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish-assets:
    name: Publish cloud-built release assets
    needs: build-and-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Validate release version
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$RELEASE_TAG" = "v$(tr -d '[:space:]' < VERSION)"
          test -f "docs/releases/$RELEASE_TAG.md"

      - name: Download universal app built by this workflow
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: NetSpeed-universal
          path: release-assets

      - name: Prepare release filenames and checksums
        working-directory: release-assets
        run: |
          mv NetSpeed-universal.zip NetSpeed-macOS-universal.zip
          sha256sum NetSpeed-macOS-universal.zip > SHA256SUMS.txt

      - name: Prepare release notes with build provenance
        run: |
          cp "docs/releases/$RELEASE_TAG.md" release-notes.md
          python3 - <<'PY'
          import os
          from pathlib import Path
          url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          commit = os.environ['GITHUB_SHA']
          with Path('release-notes.md').open('a') as notes:
              notes.write(f'\n\n---\nBuilt and checked by [GitHub Actions]({url}) from commit `{commit}`.\n')
          PY

      - name: Attach cloud-built app and checksums to the release
        run: |
          gh release upload "$RELEASE_TAG" release-assets/NetSpeed-macOS-universal.zip release-assets/SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --notes-file release-notes.md
